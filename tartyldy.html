<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Text with Particles</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000; 
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        #background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
   
        #text-container {
            font-size: 3em;
            font-weight: bold;
            background-image: linear-gradient(45deg, #FFA500, #FF4500); 
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent; 
            text-align: center;
            text-transform: none;
            z-index: 1;
            padding: 20px;
            animation: fade-in-out 3s ease-in-out infinite;
        }
        
        @keyframes fade-in-out {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <canvas id="background"></canvas>
    <div id="text-container">Айта бер әңгімеңді</div>
    <script>
        const canvas = document.getElementById('background');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particlesArray = [];
        const numberOfParticles = 100;

      
        const texts = [
            "Aıta ber áńgimeńdi",
            "Tańǵa deıin jalǵap",
            "Qulaq túrip tyńdap",
            "Otyraıyn tańdana"
        ];

        
        let textIndex = 0;
        const textContainer = document.getElementById('text-container');

        
        function changeText() {
            textContainer.innerText = texts[textIndex];
            textIndex = (textIndex + 1) % texts.length; 
        }

        
        setInterval(changeText, 3000);
        changeText(); 

       
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
                this.color = 'rgba(255, 69, 0, 0.8)'; 
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0 || this.x > canvas.width) {
                    this.speedX = -this.speedX;
                }
                if (this.y < 0 || this.y > canvas.height) {
                    this.speedY = -this.speedY;
                }
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();
            }
        }

       
        function initParticles() {
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

  
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(particle => {
                particle.update();
                particle.draw();
            });
            requestAnimationFrame(animate);
        }


        initParticles();
        animate();

  
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
